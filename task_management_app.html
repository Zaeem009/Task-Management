
<style>
  :root {
    --color-background: #f7fbff;
    --color-surface: #ffffff;
    --color-surface-alt: #f1f8ff;
    --color-surface-soft: #edf5ff;
    --color-border: #dce7f3;
    --color-border-strong: #c7d7e8;
    --color-text-primary: #20334d;
    --color-text-secondary: #55687d;
    --color-text-tertiary: #7a8ca1;
    --color-accent: #4d96ff;
    --color-accent-strong: #1b6edf;
    --color-success: #3aa77a;
    --color-success-strong: #1f7b60;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(180deg, #f8fbff 0%, #e8f2ff 100%); color: var(--color-text-primary); }
  body { padding: 24px; }

  .app { display: grid; grid-template-columns: 240px 1fr; min-height: 680px; border-radius: 28px; overflow: hidden; box-shadow: 0 28px 60px rgba(39, 79, 148, 0.12); background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); }

  .sidebar { background: rgba(255, 255, 255, 0.95); border-right: 1px solid var(--color-border); padding: 24px 0; display: flex; flex-direction: column; }
  .sidebar-brand { padding: 0 22px 24px; border-bottom: 1px solid var(--color-border); margin-bottom: 20px; }
  .brand-name { font-size: 18px; font-weight: 700; color: var(--color-text-primary); display: flex; align-items: center; gap: 10px; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--color-success); box-shadow: 0 0 0 4px rgba(58, 167, 122, 0.12); }

  .sidebar-section { padding: 0 16px; margin-bottom: 18px; }
  .sidebar-label { font-size: 11px; color: var(--color-text-tertiary); text-transform: uppercase; letter-spacing: 0.14em; padding: 0 8px; margin-bottom: 10px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 12px; border-radius: 16px; font-size: 14px; color: var(--color-text-secondary); cursor: pointer; transition: all 0.2s ease; }
  .nav-item:hover { background: var(--color-surface-soft); color: var(--color-text-primary); }
  .nav-item.active { background: var(--color-surface-alt); color: var(--color-primary, var(--color-text-primary)); font-weight: 600; border: 1px solid rgba(77, 150, 255, 0.18); }
  .nav-item i { font-size: 16px; }
  .badge { margin-left: auto; font-size: 11px; background: #eef5ff; color: var(--color-accent-strong); padding: 3px 8px; border-radius: 999px; }

  .main { display: flex; flex-direction: column; overflow: hidden; background: var(--color-background); }
  .topbar { padding: 24px 28px; border-bottom: 1px solid var(--color-border); display: grid; grid-template-columns: 1fr auto; align-items: center; position: relative; }
  .topbar-title { font-size: 20px; font-weight: 700; color: var(--color-text-primary); justify-self: center; }
  .topbar-actions { display: flex; align-items: center; gap: 12px; justify-self: end; }

  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 16px; font-size: 14px; cursor: pointer; border: 1px solid var(--color-border); background: #ffffff; color: var(--color-text-primary); transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease; }
  .btn:hover { background: var(--color-surface-soft); transform: translateY(-1px); }
  .btn-primary { background: var(--color-accent); color: #ffffff; border-color: transparent; box-shadow: 0 10px 24px rgba(77, 150, 255, 0.22); }
  .btn-primary:hover { background: var(--color-accent-strong); }

  .content { padding: 20px 28px 28px; flex: 1; overflow-y: auto; }
  .filter-bar { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
  .filter-chip { font-size: 12px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text-secondary); cursor: pointer; transition: all 0.18s ease; }
  .filter-chip.active { background: #eef5ff; color: var(--color-accent-strong); border-color: rgba(77, 150, 255, 0.25); font-weight: 600; }
  .filter-chip:hover:not(.active) { background: var(--color-surface-soft); }

  .stats-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat-card { background: #ffffff; border: 1px solid var(--color-border); border-radius: 22px; padding: 18px 20px; box-shadow: 0 16px 30px rgba(9, 30, 66, 0.06); }
  .stat-label { font-size: 11px; color: var(--color-text-tertiary); margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
  .stat-val { font-size: 24px; font-weight: 700; color: var(--color-text-primary); }
  .stat-sub { font-size: 12px; color: var(--color-text-secondary); margin-top: 6px; }
  .progress-bar-wrap { height: 6px; background: #eef5ff; border-radius: 999px; margin-top: 12px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 999px; background: var(--color-accent); transition: width 0.3s ease; }

  .add-form { background: #ffffff; border: 1px solid var(--color-border); border-radius: 22px; padding: 18px 20px; margin-bottom: 22px; display: none; flex-direction: column; gap: 14px; box-shadow: 0 20px 40px rgba(9, 30, 66, 0.07); }
  .add-form.visible { display: flex; }
  .form-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  input[type=text], select { font-size: 14px; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--color-border); background: var(--color-surface-alt); color: var(--color-text-primary); flex: 1; min-width: 160px; }
  input[type=text]:focus, select:focus { outline: none; border-color: var(--color-accent); box-shadow: 0 0 0 4px rgba(77, 150, 255, 0.12); }

  .tasks-list { display: flex; flex-direction: column; gap: 14px; }
  .task-card { background: #ffffff; border: 1px solid var(--color-border); border-radius: 24px; padding: 18px 18px 18px 16px; display: flex; align-items: flex-start; gap: 16px; transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease; cursor: pointer; }
  .task-card:hover { transform: translateY(-1px); box-shadow: 0 24px 45px rgba(22, 60, 111, 0.08); border-color: rgba(77, 150, 255, 0.18); }
  .task-card.done { opacity: 0.72; }

  .check-box { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--color-border); flex-shrink: 0; margin-top: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s ease; background: #f7fbff; }
  .check-box.checked { background: var(--color-success); border-color: var(--color-success); }
  .check-box.checked::after { content: ''; display: block; width: 5px; height: 9px; border: 2px solid #fff; border-left: none; border-top: none; transform: rotate(45deg) translate(-1px, -1px); }

  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 15px; color: var(--color-text-primary); font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
  .task-card.done .task-title { text-decoration: line-through; color: var(--color-text-tertiary); font-weight: 500; }
  .task-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 5px 10px; border-radius: 999px; font-weight: 600; }
  .tag-high { background: #fff0ec; color: #b94b28; }
  .tag-medium { background: #fff7e4; color: #a26a22; }
  .tag-low { background: #e8f8f2; color: #1f7b59; }
  .tag-cat { background: #f4f9ff; color: var(--color-accent-strong); }
  .due-date { font-size: 12px; color: var(--color-text-tertiary); display: flex; align-items: center; gap: 6px; }
  .due-date.overdue { color: #bb3f30; }

  .task-actions { display: flex; gap: 8px; opacity: 0; transition: opacity 0.18s ease; }
  .task-card:hover .task-actions { opacity: 1; }
  .icon-btn { width: 32px; height: 32px; border-radius: 14px; border: 1px solid var(--color-border); background: var(--color-surface-alt); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--color-text-secondary); transition: background 0.18s ease, transform 0.18s ease; }
  .icon-btn:hover { background: #eef5ff; transform: translateY(-1px); color: var(--color-text-primary); }

  .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: #e8f7ff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--color-accent-strong); }
  .sidebar-footer { margin-top: auto; padding: 18px 22px 0; border-top: 1px solid var(--color-border); }
  .user-row { display: flex; align-items: center; gap: 12px; }
  .user-info { font-size: 12px; }
  .user-name { font-weight: 700; color: var(--color-text-primary); }
  .user-role { color: var(--color-text-tertiary); }

  .empty-state { text-align: center; padding: 44px 0; color: var(--color-text-secondary); font-size: 15px; }
  .page-heading { text-align: center; font-size: 28px; font-weight: 700; color: var(--color-text-primary); margin: 0 0 18px; letter-spacing: -0.02em; }

  @media (max-width: 960px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--color-border); }
    .topbar, .content { padding-left: 20px; padding-right: 20px; }
    .stats-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>

<h2 class="page-heading">Task Manager</h2>

<div class="app" id="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-name"><span class="brand-dot"></span> TaskFlow</div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Views</div>
      <div class="nav-item active" onclick="setView('all')"><i class="ti ti-layout-list" aria-hidden="true"></i> All tasks <span class="badge" id="badge-all">0</span></div>
      <div class="nav-item" onclick="setView('today')"><i class="ti ti-sun" aria-hidden="true"></i> Today</div>
      <div class="nav-item" onclick="setView('upcoming')"><i class="ti ti-calendar" aria-hidden="true"></i> Upcoming</div>
      <div class="nav-item" onclick="setView('done')"><i class="ti ti-check" aria-hidden="true"></i> Completed</div>
    </div>
    <div class="sidebar-section" style="margin-top:12px">
      <div class="sidebar-label">Projects</div>
      <div class="nav-item"><i class="ti ti-code" aria-hidden="true"></i> Engineering</div>
      <div class="nav-item"><i class="ti ti-palette" aria-hidden="true"></i> Design</div>
      <div class="nav-item"><i class="ti ti-chart-bar" aria-hidden="true"></i> Marketing</div>
    </div>
    <div class="sidebar-footer">
      <div class="user-row">
        <div class="user-avatar">Z</div>
        <div class="user-info">
          <div class="user-name">Zaeem</div>
          <div class="user-role">Admin</div>
        </div>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-title" id="view-title">All tasks</div>
      <div class="topbar-actions">
        <button class="btn" onclick="toggleForm()"><i class="ti ti-plus" aria-hidden="true"></i> Add task</button>
      </div>
    </div>
    <div class="content">
      <div class="stats-row">
        <div class="stat-card"><div class="stat-label">Total</div><div class="stat-val" id="s-total">0</div><div class="stat-sub">tasks</div></div>
        <div class="stat-card"><div class="stat-label">In progress</div><div class="stat-val" id="s-progress">0</div><div class="stat-sub">active</div></div>
        <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-val" id="s-done">0</div><div class="stat-sub">this week</div></div>
        <div class="stat-card"><div class="stat-label">Progress</div><div class="stat-val" id="s-pct">0%</div><div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div></div>
      </div>

      <div class="add-form" id="add-form">
        <input type="text" id="new-title" placeholder="Task title…" />
        <div class="form-row">
          <select id="new-priority">
            <option value="high">High priority</option>
            <option value="medium" selected>Medium priority</option>
            <option value="low">Low priority</option>
          </select>
          <select id="new-cat">
            <option>Engineering</option>
            <option>Design</option>
            <option>Marketing</option>
            <option>Research</option>
          </select>
          <input type="text" id="new-due" placeholder="Due date (e.g. Jun 2)" style="max-width:130px" />
          <button class="btn btn-primary" onclick="addTask()">Add</button>
          <button class="btn" onclick="toggleForm()">Cancel</button>
        </div>
      </div>

      <div class="filter-bar">
        <div class="filter-chip active" onclick="setFilter('all',this)">All</div>
        <div class="filter-chip" onclick="setFilter('high',this)">High priority</div>
        <div class="filter-chip" onclick="setFilter('medium',this)">Medium</div>
        <div class="filter-chip" onclick="setFilter('low',this)">Low</div>
        <div class="filter-chip" onclick="setFilter('todo',this)">To do</div>
        <div class="filter-chip" onclick="setFilter('done',this)">Done</div>
      </div>

      <div class="tasks-list" id="tasks-list"></div>
    </div>
  </main>
</div>

<script>
let tasks = [
  {id:1, title:'Set up authentication with JWT', priority:'high', cat:'Engineering', due:'May 31', done:false},
  {id:2, title:'Design onboarding flow mockups', priority:'medium', cat:'Design', due:'Jun 3', done:false},
  {id:3, title:'Write API documentation', priority:'low', cat:'Engineering', due:'Jun 5', done:true},
  {id:4, title:'Q2 campaign brief', priority:'high', cat:'Marketing', due:'May 30', done:false},
  {id:5, title:'Implement WebSocket real-time updates', priority:'medium', cat:'Engineering', due:'Jun 8', done:false},
  {id:6, title:'Responsive layout QA on mobile', priority:'low', cat:'Design', due:'Jun 10', done:true},
  {id:7, title:'User research interviews — 5 sessions', priority:'medium', cat:'Research', due:'Jun 12', done:false},
];
let filter = 'all';
let view = 'all';
let nextId = 8;

const today = new Date();

function isOverdue(dueStr) {
  if (!dueStr) return false;
  const d = new Date(dueStr + ' 2026');
  return d < today;
}

function priorityTag(p) {
  const map = {high:'tag-high', medium:'tag-medium', low:'tag-low'};
  return `<span class="tag ${map[p]}">${p.charAt(0).toUpperCase()+p.slice(1)}</span>`;
}

function filteredTasks() {
  let list = tasks;
  if (view === 'done') list = list.filter(t => t.done);
  else if (view === 'today') list = list.filter(t => !t.done && t.due);
  else if (view === 'upcoming') list = list.filter(t => !t.done);
  else list = list.filter(t => true);

  if (filter === 'high') list = list.filter(t => t.priority==='high');
  else if (filter === 'medium') list = list.filter(t => t.priority==='medium');
  else if (filter === 'low') list = list.filter(t => t.priority==='low');
  else if (filter === 'todo') list = list.filter(t => !t.done);
  else if (filter === 'done') list = list.filter(t => t.done);
  return list;
}

function render() {
  const list = filteredTasks();
  const el = document.getElementById('tasks-list');
  if (!list.length) { el.innerHTML = '<div class="empty-state"><i class="ti ti-check" style="font-size:32px;display:block;margin-bottom:8px" aria-hidden="true"></i>No tasks here</div>'; }
  else {
    el.innerHTML = list.map(t => `
      <div class="task-card${t.done?' done':''}" id="tc-${t.id}">
        <div class="check-box${t.done?' checked':''}" onclick="toggleDone(${t.id})" aria-label="${t.done?'Mark incomplete':'Mark complete'}"></div>
        <div class="task-body">
          <div class="task-title">${t.title}</div>
          <div class="task-meta">
            ${priorityTag(t.priority)}
            <span class="tag tag-cat">${t.cat}</span>
            ${t.due ? `<span class="due-date${isOverdue(t.due)&&!t.done?' overdue':''}"><i class="ti ti-calendar" style="font-size:12px" aria-hidden="true"></i>${t.due}</span>` : ''}
          </div>
        </div>
        <div class="task-actions">
          <div class="icon-btn" onclick="deleteTask(${t.id})" aria-label="Delete task"><i class="ti ti-trash" style="font-size:14px" aria-hidden="true"></i></div>
        </div>
      </div>
    `).join('');
  }
  updateStats();
}

function updateStats() {
  const total = tasks.length;
  const done = tasks.filter(t=>t.done).length;
  const active = total - done;
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-progress').textContent = active;
  document.getElementById('s-done').textContent = done;
  document.getElementById('s-pct').textContent = pct+'%';
  document.getElementById('progress-bar').style.width = pct+'%';
  document.getElementById('badge-all').textContent = total;
}

function toggleDone(id) {
  const t = tasks.find(t=>t.id===id);
  if (t) t.done = !t.done;
  render();
}

function deleteTask(id) {
  tasks = tasks.filter(t=>t.id!==id);
  render();
}

function toggleForm() {
  const f = document.getElementById('add-form');
  f.classList.toggle('visible');
  if (f.classList.contains('visible')) document.getElementById('new-title').focus();
}

function addTask() {
  const title = document.getElementById('new-title').value.trim();
  if (!title) return;
  tasks.unshift({
    id: nextId++,
    title,
    priority: document.getElementById('new-priority').value,
    cat: document.getElementById('new-cat').value,
    due: document.getElementById('new-due').value,
    done: false
  });
  document.getElementById('new-title').value = '';
  document.getElementById('new-due').value = '';
  document.getElementById('add-form').classList.remove('visible');
  render();
}

document.getElementById('new-title').addEventListener('keydown', e => { if (e.key==='Enter') addTask(); });

function setFilter(f, el) {
  filter = f;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  render();
}

function setView(v) {
  view = v;
  const titles = {all:'All tasks', today:'Today', upcoming:'Upcoming', done:'Completed'};
  document.getElementById('view-title').textContent = titles[v];
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  event.currentTarget.classList.add('active');
  render();
}

render();
</script>
